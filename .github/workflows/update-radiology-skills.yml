name: Replace radiology-skills from staged package
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace directory from staged archive
        shell: bash
        run: |
          set -euo pipefail
          test -f radiology-skills-1.10.1.zip
          rm -rf /tmp/radiology-update
          mkdir -p /tmp/radiology-update
          unzip -q radiology-skills-1.10.1.zip -d /tmp/radiology-update
          test -d /tmp/radiology-update/radiology-skill
          rm -rf radiology-skills
          mv /tmp/radiology-update/radiology-skill radiology-skills
          rm -f radiology-skills-1.10.1.zip child.txt root.txt
          rm -f .github/workflows/update-radiology-skills.yml
      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace radiology-skills with latest source [skip ci]"
          git push origin HEAD:main
